name: CI

# 统一 Android CI 规范（与 ZYEmail / ZYNotificationHistory 同构）：
#   push main / v* 标签 / PR / 手动触发；质量门(build) -> lint -> release 三段。
# 本仓库走标准 gradle wrapper，与 ZYEmail（setup-gradle 直调）不同，其余完全一致。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  # ------------------------------------------------------- 单测 + Debug 构建
  build:
    name: 测试 / 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      # setup-gradle 不指定版本时走 wrapper，并缓存依赖与 wrapper 发行包
      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi

      # debug 包同样使用固定签名：还原 keystore 后，build.gradle 的 debug
      # buildType 会自动挂上同一把证书；Secret 缺失时退回默认调试签名并告警
      # （PR 来自 fork 等场景拿不到 Secrets，不能因此挡住质量门）
      - name: 还原固定签名 keystore（debug 包同样签名）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 等 Secret，本次 debug 包将使用随机调试签名（配置方法见 docs/SIGNING.md）"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "KEYSTORE_PATH=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # 输出 debug 包签名证书 SHA-256 到 Step Summary：应与 Release 包
      # 完全一致（固定校验值），证明固定签名在 debug 构建上同样生效
      - name: 校验签名指纹
        if: env.KEYSTORE_PATH != ''
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          SHA256=$(grep -oE 'SHA-256 digest: .*' certs.txt | head -1 | cut -d' ' -f3-)
          {
            echo "### Debug APK 签名指纹（固定校验值）"
            echo '```'
            echo "SHA-256: $SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 写入构建摘要
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: RemoteFileManager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RemoteFileManager-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- Lint
  lint:
    name: Lint 检查
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      - name: 运行 Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: 汇总 Lint 结果
        if: always()
        run: |
          REPORT="app/build/reports/lint-results-debug.txt"
          {
            echo "### Lint"
            if [ -f "$REPORT" ]; then
              echo "- 错误数：$(grep -c 'Error:' "$REPORT" || true)"
              echo "- 提示数：$(grep -c 'Warning:' "$REPORT" || true)"
            else
              echo "未生成 lint 报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RemoteFileManager-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------- Release（仅 v* 标签触发）
  release:
    name: 发布 Release APK
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      # 从仓库 Secret 还原固定发布 keystore（缺失则直接失败，绝不出随机签名的包，
      # 否则用户已安装的版本将无法覆盖升级；配置方法见 docs/SIGNING.md）
      - name: 还原固定签名 keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::未配置 KEYSTORE_BASE64 等 Secret，无法产出签名固定的 Release 包（配置方法见 docs/SIGNING.md）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          {
            echo "KEYSTORE_PATH=release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # 正式发布通道使用固定签名的 release 包（此前挂 debug 包，
      # debug 签名每次构建都不同，会导致无法覆盖升级）
      - name: 构建 Release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      # 输出签名证书 SHA-256 到 Step Summary：这是固定校验值，
      # 每次发版应完全一致，用户可据此核对更新包来源
      - name: 校验签名指纹
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          SHA256=$(grep -oE 'SHA-256 digest: .*' certs.txt | head -1 | cut -d' ' -f3-)
          {
            echo "### 签名指纹（固定校验值）"
            echo '```'
            echo "SHA-256: $SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 重命名 APK（带版本号）
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "dist/RemoteFileManager-${GITHUB_REF_NAME}-release.apk"
          done
          ls -lh dist/

      - name: 创建 Release 并附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
