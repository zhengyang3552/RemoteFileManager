name: CI

# 统一 Android CI 规范（与 ZYEmail / ZYNotificationHistory 同构）：
#   push main / v* 标签 / PR / 手动触发；质量门(build) -> lint -> release 三段。
# 本仓库走标准 gradle wrapper，与 ZYEmail（setup-gradle 直调）不同，其余完全一致。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  # ------------------------------------------------------- 单测 + Debug 构建
  build:
    name: 测试 / 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      # setup-gradle 不指定版本时走 wrapper，并缓存依赖与 wrapper 发行包
      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          else
            echo "sdkmanager not found, fallback to preinstalled SDK"
          fi

      - name: 单元测试
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: 构建 Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: 写入构建摘要
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          {
            echo "### Debug APK"
            echo "- 产物：\`$APK\`"
            echo "- 大小：$(du -h "$APK" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: RemoteFileManager-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RemoteFileManager-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------- Lint
  lint:
    name: Lint 检查
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 补齐 Android SDK 组件
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          fi

      - name: 运行 Lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: 汇总 Lint 结果
        if: always()
        run: |
          REPORT="app/build/reports/lint-results-debug.txt"
          {
            echo "### Lint"
            if [ -f "$REPORT" ]; then
              echo "- 错误数：$(grep -c 'Error:' "$REPORT" || true)"
              echo "- 提示数：$(grep -c 'Warning:' "$REPORT" || true)"
            else
              echo "未生成 lint 报告"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: RemoteFileManager-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------- Release（仅 v* 标签触发）
  release:
    name: 发布 Release APK
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      # Release 附件复用 build job 的 Debug 产物（本仓库无签名配置，
      # 发布通道以 debug 包为准，与既有习惯一致）
      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          name: RemoteFileManager-debug
          path: dist

      - name: 重命名 APK（带版本号）
        run: |
          cd dist
          for f in *.apk; do
            mv "$f" "RemoteFileManager-${GITHUB_REF_NAME}-debug.apk"
          done
          ls -lh

      - name: 创建 Release 并附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
